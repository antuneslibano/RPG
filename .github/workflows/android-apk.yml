name: APK Android

# Gera um APK instalável. Rode manualmente em Actions -> "APK Android" -> "Run workflow",
# ou deixe disparar a cada push nas branches abaixo. O APK sai como artefato do run.
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'claude/**']

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O runner do GitHub já traz o Android SDK. A ação setup-android@v3 falha
      # tentando instalar o pacote legado "tools", que não existe mais no
      # repositório do SDK — então usamos o SDK pré-instalado e apenas
      # aceitamos as licenças para o Gradle poder baixar o que faltar.
      - name: Aceitar licenças do Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          ls "$SDK/platforms" || true

      - name: Instalar dependências
        run: npm ci

      - name: Checagens (typecheck, lint, testes)
        run: npm run qa

      # O projeto nativo não é versionado: o Expo o regenera a partir do app.json.
      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install

      # Assinatura: usa os secrets do repositório quando existirem; senão gera uma
      # chave efêmera só para este build (o APK instala normalmente, mas uma
      # atualização exige desinstalar a versão anterior).
      - name: Preparar chave de assinatura
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Usando a chave de assinatura dos secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sem secrets de assinatura: gerando chave efêmera para este build."
            KEYSTORE_PASSWORD=rpglocal
            KEY_ALIAS=rpg
            KEY_PASSWORD=rpglocal
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=RPG, OU=Game, O=RPG, L=-, S=-, C=BR"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "RPG_UPLOAD_STORE_FILE=$KEYSTORE_PATH"
            echo "RPG_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RPG_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "RPG_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Injetar configuração de assinatura
        run: node scripts/configure-android-signing.mjs

      # Duas variantes: arm64 cobre praticamente todo celular atual e é bem
      # menor de baixar; a universal fica como garantia para aparelhos antigos
      # (armeabi-v7a) e emuladores x86.
      - name: Compilar APK arm64
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Guardar APK arm64
        run: cp "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)" RPG-arm64.apk

      - name: Compilar APK universal
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Guardar APK universal
        id: apk
        run: |
          set -euo pipefail
          cp "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)" RPG.apk
          echo "path=RPG.apk" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h RPG.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "size_arm64=$(du -h RPG-arm64.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: RPG-apk
          path: |
            RPG.apk
            RPG-arm64.apk
          retention-days: 30
          if-no-files-found: error

      # O artefato do Actions vem zipado e exige login — ruim para instalar pelo
      # celular. O release dá um link .apk direto e estável, sempre na última build.
      - name: Publicar release com link direto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Build automática de \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA::7}\`).

          | Arquivo | Para quem | Tamanho |
          | --- | --- | --- |
          | \`RPG-arm64.apk\` | praticamente todo celular atual — **comece por este** | ${{ steps.apk.outputs.size_arm64 }} |
          | \`RPG.apk\` | universal: aparelhos antigos (armeabi-v7a) e emuladores x86 | ${{ steps.apk.outputs.size }} |

          **Instalar:** baixe pelo navegador do celular, permita \"instalar apps de
          fontes desconhecidas\" quando o Android pedir, e abra o arquivo.

          Estes links sempre apontam para a build mais recente."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --notes "$NOTES"
            gh release upload apk-latest RPG.apk RPG-arm64.apk --clobber
          else
            gh release create apk-latest RPG.apk RPG-arm64.apk \
              --title "RPG — APK mais recente" \
              --notes "$NOTES"
          fi
          echo "APK_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/RPG.apk" >> "$GITHUB_ENV"

      - name: Resumo
        run: |
          {
            echo "## APK pronto"
            echo ""
            echo "- \`RPG-arm64.apk\` (${{ steps.apk.outputs.size_arm64 }}) — recomendado"
            echo "- \`RPG.apk\` universal (${{ steps.apk.outputs.size }})"
            echo "- **Link direto:** $APK_URL"
            echo "- Ou baixe em **Artifacts → RPG-apk** no topo desta página."
            echo "- No celular: permita \"instalar apps de fontes desconhecidas\" e abra o APK."
            if [ "${{ steps.signing.outputs.stable }}" != "true" ]; then
              echo ""
              echo "> Assinado com uma chave efêmera deste build. Para instalar por cima"
              echo "> de uma versão anterior sem desinstalar, configure os secrets"
              echo "> \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`,"
              echo "> \`ANDROID_KEY_ALIAS\` e \`ANDROID_KEY_PASSWORD\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
